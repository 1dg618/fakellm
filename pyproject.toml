[project]
name = "fakellm"
version = "0.3.1"
description = "A mock LLM server for testing. Drop-in replacement for OpenAI and Anthropic APIs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Douglas Gregor", email = "1dg618@gmail.com" }]
keywords = ["llm", "testing", "mock", "mock-server", "stub", "fake-api", "openai", "anthropic", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pyyaml>=6.0",
    "click>=8.1",
]

[project.urls]
Homepage = "https://github.com/dgregor/fakellm"
Repository = "https://github.com/dgregor/fakellm"
Documentation = "https://github.com/dgregor/fakellm#readme"
Issues = "https://github.com/dgregor/fakellm/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "openai>=1.40",
    "anthropic>=0.34",
]